# Placeholder. This image ships the built assets and nothing that knows about your deployment:
# replace this file with your own server block. See the README for what it has to provide.
#
# Answers every path, /health included, so a probe fails rather than reporting a healthy
# placeholder, and so this is noticed at deploy time rather than by a confused user.

server {
    listen 8080;
    server_name _;

    location / {
        default_type text/plain;
        return 503 "element-admin: no site configuration mounted.\n\nThis image serves nothing on its own. Mount a server block over\n/etc/nginx/conf.d/default.conf that roots at /dist, and inject the\nruntime configuration. See the image README.\n";
    }
}
