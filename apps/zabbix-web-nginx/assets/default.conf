# Placeholder. This image ships the Zabbix frontend's files and no idea where php-fpm is: replace
# this with a server block that proxies .php to the zabbix-web-php container. See the README.
#
# Answers every path, including /ping, so a probe fails rather than reporting a healthy
# placeholder, and so this is noticed at deploy time rather than by a confused user.

server {
    listen 8080;
    server_name _;

    location / {
        default_type text/plain;
        return 503 "zabbix-web-nginx: no site configuration mounted.\n\nThis image serves nothing on its own. Mount a server block over\n/etc/nginx/conf.d/default.conf that roots at /usr/share/zabbix and\npasses .php to the php-fpm container. See the image README.\n";
    }
}
