; php-fpm, one pool, listening on TCP for the nginx container beside it. Tuning only: nothing here
; is deployment-specific, so a chart that wants different pm settings mounts over this file.
[global]
; The log goes to the container's stderr, which is where a container's logs belong
error_log = /proc/self/fd/2
daemonize = no

[zabbix]
; No user or group: the container already runs as 1997:1995 and FPM ignores both unless it starts
; as root, which it never does here. Setting them only produces a NOTICE on every start.
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.status_path = /php-fpm-status

; The frontend's own requirements, from the Zabbix documentation
php_value[max_execution_time] = 300
php_value[memory_limit] = 128M
php_value[post_max_size] = 16M
php_value[upload_max_filesize] = 2M
php_value[max_input_time] = 300
php_value[max_input_vars] = 10000

; Only the frontend's entry points may be executed, so an upload that lands somewhere under the
; document root cannot be run as PHP
security.limit_extensions = .php

catch_workers_output = yes
decorate_workers_output = no
