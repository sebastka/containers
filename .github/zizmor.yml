---
rules:
  dangerous-triggers:
    ignore:
      # Labeler runs on pull_request_target so it can label fork PRs. It checks
      # out with persist-credentials: false and acts only through a scoped app
      # token, so the dangerous trigger is intentional and contained.
      - labeler.yaml
      # Retry Release uses workflow_run but checks out nothing and runs no code
      # from the triggering run: it only re-runs the failed jobs of a
      # push-triggered (trusted) Release run through the API.
      - retry-release.yaml
