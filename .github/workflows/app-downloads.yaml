---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: App Downloads

# Keeps apps' pinned downloads current, versions and sha256 together: each app with a
# scripts/update-downloads.py (deluge: libtorrent, Boost, 7-Zip, UnRAR, DB-IP; paperless: the
# release tarball, jbig2enc...). Renovate cannot: none has a datasource that also yields the checksum.
# One pull request per app, so each builds, tests and releases on its own.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays: monthly and occasional releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-26.04
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List Apps
        id: apps
        run: |-
          apps="$(find apps -path 'apps/*/scripts/update-downloads.py' | cut -d/ -f2 | sort | jq -R . | jq -sc .)"
          echo "apps=${apps}" >> "${GITHUB_OUTPUT}"

  update:
    name: Update (${{ matrix.app }})
    needs:
      - plan
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update Downloads
        env:
          APP: ${{ matrix.app }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          python3 "apps/${APP}/scripts/update-downloads.py" | tee "${RUNNER_TEMP}/pr-body.md" >> "${GITHUB_STEP_SUMMARY}"

      # A pull request from the app token, unlike one from GITHUB_TOKEN, runs the build and tests
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: apps/${{ matrix.app }}
          body-path: ${{ runner.temp }}/pr-body.md
          branch: ${{ matrix.app }}/downloads
          commit-message: "release(${{ matrix.app }}): update pinned downloads"
          delete-branch: true
          sign-commits: true
          signoff: true
          title: "release(${{ matrix.app }}): update pinned downloads"
          token: ${{ steps.app-token.outputs.token }}
