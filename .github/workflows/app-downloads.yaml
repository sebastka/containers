---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: App Downloads

# Keeps apps' pinned downloads current, versions and sha256 together: each app with a
# scripts/update-downloads.py (deluge: libtorrent, Boost, 7-Zip, UnRAR, DB-IP; paperless: the
# release tarball, jbig2enc...). Renovate cannot: none has a datasource that also yields the checksum.
# One pull request per app, so each builds, tests and releases on its own.
on:
  schedule:
    # Nightly, ahead of the chart. GitHub cron is UTC, so 01:00 is 03:00 in
    # Europe/Oslo on summer time and 02:00 on winter time: inside 02:00-04:00
    # either way, and before the 04:00-06:00 Oslo window sebastka/charts gives
    # Renovate for ghcr.io/sebastka/** images. A run with nothing to update
    # writes no files and opens no pull request.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-26.04
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List Apps
        id: apps
        run: |-
          apps="$(find apps -path 'apps/*/scripts/update-downloads.py' | cut -d/ -f2 | sort | jq -R . | jq -sc .)"
          echo "apps=${apps}" >> "${GITHUB_OUTPUT}"

  update:
    name: Update (${{ matrix.app }})
    needs:
      - plan
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # deluge's script recompiles requirements.txt with uv. Only uv: the scripts are standard
      # library otherwise, and installing go and node here would cost more than the job
      - name: Setup Mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: --locked uv

      - name: Update Downloads
        env:
          APP: ${{ matrix.app }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          python3 "apps/${APP}/scripts/update-downloads.py" | tee "${RUNNER_TEMP}/pr-body.md" >> "${GITHUB_STEP_SUMMARY}"

      # A pull request from the app token, unlike one from GITHUB_TOKEN, runs the build and tests
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          add-paths: apps/${{ matrix.app }}
          body-path: ${{ runner.temp }}/pr-body.md
          branch: ${{ matrix.app }}/downloads
          commit-message: "release(${{ matrix.app }}): update pinned downloads"
          delete-branch: true
          sign-commits: true
          signoff: true
          title: "release(${{ matrix.app }}): update pinned downloads"
          token: ${{ steps.app-token.outputs.token }}

      # These changes are a version and its checksum in docker-bake.hcl and the Dockerfile, which
      # .renovaterc.json5 already auto-merges when Renovate is the one proposing them. The build and
      # test matrix runs on this pull request and Build Success gates the merge, so wait for that
      # rather than for a human. Skipped when nothing changed (no operation) or when the update
      # reverted and the action closed the pull request.
      - name: Enable Auto-merge
        if: ${{ steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: |-
          # An updated pull request keeps the setting, so only turn it on when it is off. Ask for the
          # comparison rather than the field: --jq prints an empty line for a JSON null, never "null",
          # and an unreadable state has to fail here instead of quietly skipping the merge.
          enabled="$(gh pr view "${PR}" --repo "${REPO}" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          case "${enabled}" in
              true) echo "Auto-merge already enabled on #${PR}" ;;
              false) gh pr merge "${PR}" --repo "${REPO}" --auto --squash ;;
              *) echo "::error::Could not read the auto-merge state of #${PR}: '${enabled}'" && exit 1 ;;
          esac
