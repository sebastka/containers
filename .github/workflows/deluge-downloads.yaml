---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deluge Downloads

# Keeps apps/deluge's pinned downloads current, versions and sha256 together: 7-Zip, UnRAR and the
# DB-IP database (apps/deluge/scripts/update-downloads.py). Renovate cannot: none has a datasource
# that also yields the checksum, and UnRAR's source names do not tell betas apart.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays: DB-IP publishes monthly, 7-Zip and UnRAR a few times a year
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update Downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          python3 apps/deluge/scripts/update-downloads.py | tee "${RUNNER_TEMP}/pr-body.md" >> "${GITHUB_STEP_SUMMARY}"

      # A pull request from the app token, unlike one from GITHUB_TOKEN, runs the build and tests
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          body-path: ${{ runner.temp }}/pr-body.md
          branch: deluge/downloads
          commit-message: "release(deluge): update pinned downloads"
          delete-branch: true
          sign-commits: true
          signoff: true
          title: "release(deluge): update pinned downloads"
          token: ${{ steps.app-token.outputs.token }}
