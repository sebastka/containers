---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: App Size Diff
description: Creates a Markdown summary of the size difference between two app versions

inputs:
  from-app:
    description: Baseline app image for size comparison
    required: true
  to-app:
    description: App image to be compared to the baseline
    required: true
  sizes-dir:
    description: Directory of per-platform size measurements, one JSON file per platform
    required: true

outputs:
  size-diff-markdown:
    description: Markdown formatted output of app size comparison
    value: ${{ steps.size-diff.outputs.markdown }}

runs:
  using: composite
  steps:
    - name: Create package.json
      shell: bash
      run: |-
        cat > package.json << 'EOF'
        {
          "dependencies": {
            "filesize": "^11.0.2",
            "lodash": "^4.0.0",
            "markdown-table": "^3.0.4"
          }
        }
        EOF

    - name: Setup Mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install_args: --locked

    - name: Setup Node Dependencies
      shell: bash
      run: |-
        npm install

    - name: App Size Diff
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      id: size-diff
      env:
        FROM_APP: ${{ inputs.from-app }}
        TO_APP: ${{ inputs.to-app }}
        SIZES_DIR: ${{ inputs.sizes-dir }}
      with:
        script: |-
          const fs = require("fs");
          const path = require("path");
          const { filesize } = require("filesize");
          const { markdownTable } = require("markdown-table");
          const _ = require("lodash");

          const fromApp = process.env.FROM_APP;
          const toApp = process.env.TO_APP;
          const sizesDir = process.env.SIZES_DIR;

          // One file per build matrix platform, written by the Measure App Size
          // step: { platform, previous, current }, sizes in bytes as reported by
          // docker image inspect (uncompressed).
          function readMeasurements(dir) {
              try {
                  return _(fs.readdirSync(dir))
                      .filter(file => file.endsWith(".json"))
                      .map(file => JSON.parse(fs.readFileSync(path.join(dir, file), "utf8")))
                      .filter(entry => entry && entry.platform)
                      .sortBy("platform")
                      .value();
              } catch (e) {
                  core.error(`Failed to read size measurements from ${dir}: ${e.message}`);
                  return [];
              }
          }

          const platformRow = (entry) => {
              const previous = _.get(entry, "previous", 0);
              const current = _.get(entry, "current", 0);
              const change = current - previous;

              const percentage = previous
                  ? `${change >= 0 ? "+" : ""}${_.round(change / previous * 100, 2)}%`
                  : current ? "+∞" : "+0.00%";

              const icon = _.cond([
                  [change => change < 0, _.constant("🔽")],
                  [change => change > 0, _.constant("🔼")],
                  [_.stubTrue, _.constant("🔄")]
              ])(change);

              return [
                  entry.platform,
                  filesize(previous),
                  filesize(current),
                  `${change >= 0 ? "+" : ""}${filesize(Math.abs(change))} (${percentage})`,
                  icon
              ];
          };

          const rows = [
              ["OS/Platform", "Previous", "Current", "Change", "Trend"],
              ..._.map(readMeasurements(sizesDir), platformRow)
          ];

          const output = `## 📦 App Size Analysis

          > [!NOTE]
          > Comparing \`${fromApp}\` ➔ \`${toApp}\`, uncompressed

          ### 📈 Size Comparison Table

          ${markdownTable(rows, { align: ["l", "c", "c", "c", "c"] })}`;

          core.setOutput("markdown", output);
